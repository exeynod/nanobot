x-common-build: &common-build
  build:
    context: .
    dockerfile: Dockerfile
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
    - seccomp=unconfined

x-main-config: &main-config
  <<: *common-build
  volumes:
    - ./.nanobot/instances/main:/home/nanobot/.nanobot
    - ./.nanobot/shared/oauth-tokens:/home/nanobot/.local/share/oauth-cli-kit
  env_file:
    - ./.nanobot/secrets/shared.env
    - ./.nanobot/secrets/main.env

x-ukai-config: &ukai-config
  <<: *common-build
  volumes:
    - ./.nanobot/instances/ukai:/home/nanobot/.nanobot-ukai
    - ./.nanobot/shared/oauth-tokens:/home/nanobot/.local/share/oauth-cli-kit
  env_file:
    - ./.nanobot/secrets/shared.env
    - ./.nanobot/secrets/ukai.env

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *main-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18790:18790"
      - "127.0.0.1:8765:8765"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *main-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobot/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-ukai:
    container_name: nanobot-ukai
    <<: *ukai-config
    command: ["gateway", "--config", "/home/nanobot/.nanobot-ukai/config.json"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18791:18791"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *main-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
